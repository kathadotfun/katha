services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${KATHA_DB_USER:?Set KATHA_DB_USER in .env}
      POSTGRES_PASSWORD: ${KATHA_DB_PASSWORD:?Set KATHA_DB_PASSWORD in .env}
      POSTGRES_DB: ${KATHA_DB_NAME:?Set KATHA_DB_NAME in .env}
    ports:
      - "127.0.0.1:${KATHA_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
